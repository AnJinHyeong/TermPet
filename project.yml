# XcodeGen 프로젝트 정의.
# React 비유: package.json + vite.config 같은 역할. 여기서 .xcodeproj를 "생성"한다.
# 수정 후에는 항상 `xcodegen generate` 실행.
name: TermPet

options:
  bundleIdPrefix: com.termpet
  developmentLanguage: ko
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TermPet:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # 훅 스크립트를 앱 번들 Resources에 포함 → 실행 시 ~/.termpet/ 으로 설치
      - path: Scripts/termpet-hook
        buildPhase: resources
      - path: Scripts/zsh-integration.zsh
        buildPhase: resources
      # 앱 아이콘·메뉴바 아이콘(Assets.xcassets, Scripts/make-icons.swift로 생성) + 한국어 앱 이름(InfoPlist.strings)
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        # 기본 이름은 파일 이름(TermPet.app)과 같아야 macOS가 "이름이 바뀌지 않은 앱"으로 보고
        # 언어별 이름(Resources/*.lproj/InfoPlist.strings의 "텀펫")을 Finder·Spotlight에 보여준다.
        CFBundleDisplayName: TermPet
        CFBundleName: TermPet
        CFBundleDevelopmentRegion: ko
        LSHasLocalizedDisplayName: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true          # Dock 아이콘 없음 (메뉴바 전용 앱)
        NSHumanReadableCopyright: ""
    entitlements:
      path: Sources/App/TermPet.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termpet.TermPet
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"     # 개인 사용: ad-hoc 서명
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - TermPetTests

  TermPetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: TermPet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.termpet.TermPetTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TermPet.app/Contents/MacOS/TermPet
        BUNDLE_LOADER: $(TEST_HOST)
