# 윈도우 설치 파일 만들기: npm run dist:win → dist/TermPet-Setup-<버전>.exe
# (koffi:win 이 윈도우용 koffi 바이너리를 받아 둔다. 맥에서 빌드해도 윈도우용이 들어가게)
appId: com.termpet.TermPet
productName: TermPet
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
# koffi 네이티브 모듈(.node)은 asar 압축 안에서 못 읽으므로 밖에 풀어 둔다
asarUnpack:
  - '**/*.node'
extraResources:
  - from: resources/tray.png
    to: tray.png
  - from: resources/builtin
    to: builtin
  - from: resources/hooks
    to: hooks
win:
  target: nsis
  icon: resources/icon.png
  # 맥에서 빌드할 때 wine 없이 만들기 위해 exe 아이콘·버전 정보 편집을 건너뜀 (설치 파일 아이콘은 적용됨)
  signAndEditExecutable: false
nsis:
  oneClick: true
  perMachine: false
  artifactName: TermPet-Setup-${version}.${ext}
  shortcutName: 텀펫
  createDesktopShortcut: false
