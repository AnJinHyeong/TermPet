# 윈도우판 테스트를 실제 윈도우 서버에서 실행 (훅 스크립트를 PowerShell 5.1·7 로 직접 돌려 보는 테스트 포함).
# windows/ 가 바뀐 커밋을 푸시하면 자동으로, 또는 Actions 탭에서 수동 실행.
name: Windows tests

on:
  push:
    paths: ['windows/**', '.github/workflows/windows-test.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
